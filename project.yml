name: ChatGPTA
options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSCameraUsageDescription: Camera access is used when attaching photos.
    INFOPLIST_KEY_NSMicrophoneUsageDescription: Microphone access is used for voice input.
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Photo Library access is used for attachments.

targets:
  ChatGPTA:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: ChatGPTA/Assets.xcassets
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
        PRODUCT_BUNDLE_IDENTIFIER: com.karpishyn.chatgpt.a
        PRODUCT_NAME: ChatGPTA
        INFOPLIST_KEY_CFBundleDisplayName: ChatGPT A
        INFOPLIST_KEY_RootURL: https://chatgpt.com
        INFOPLIST_KEY_StoreUUID: 33333333-3333-4333-8333-333333333333
