[project]
name = "crypto-flow"
version = "0.1.0"
description = "Multi-exchange crypto market data and order flow connector"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "orjson>=3.10.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.4.0",
    "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
