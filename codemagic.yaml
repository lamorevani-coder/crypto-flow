workflows:
  chatgpt-a-testflight:
    name: ChatGPT A — Native iPhone
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: splitai-apple
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.karpishyn.chatgpt.a
      vars:
        XCODE_PROJECT: ChatGPTA.xcodeproj
        XCODE_SCHEME: ChatGPTA
      xcode: latest
    scripts:
      - name: Install XcodeGen and SVG renderer
        script: |
          brew install xcodegen librsvg

      - name: Render app icon
        script: |
          set -euo pipefail
          ICONSET="ChatGPTA/Assets.xcassets/AppIcon.appiconset"
          mkdir -p "$ICONSET"
          rsvg-convert -w 1024 -h 1024 ChatGPTA/AppIcon.svg -o "$ICONSET/icon-1024.png"
          sips -z 40 40 "$ICONSET/icon-1024.png" --out "$ICONSET/icon-20@2x.png" >/dev/null
          sips -z 60 60 "$ICONSET/icon-1024.png" --out "$ICONSET/icon-20@3x.png" >/dev/null
          sips -z 58 58 "$ICONSET/icon-1024.png" --out "$ICONSET/icon-29@2x.png" >/dev/null
          sips -z 87 87 "$ICONSET/icon-1024.png" --out "$ICONSET/icon-29@3x.png" >/dev/null
          sips -z 80 80 "$ICONSET/icon-1024.png" --out "$ICONSET/icon-40@2x.png" >/dev/null
          sips -z 120 120 "$ICONSET/icon-1024.png" --out "$ICONSET/icon-40@3x.png" >/dev/null
          sips -z 120 120 "$ICONSET/icon-1024.png" --out "$ICONSET/icon-60@2x.png" >/dev/null
          sips -z 180 180 "$ICONSET/icon-1024.png" --out "$ICONSET/icon-60@3x.png" >/dev/null
          cat > "$ICONSET/Contents.json" <<'JSON'
          {
            "images": [
              {"filename":"icon-20@2x.png","idiom":"iphone","scale":"2x","size":"20x20"},
              {"filename":"icon-20@3x.png","idiom":"iphone","scale":"3x","size":"20x20"},
              {"filename":"icon-29@2x.png","idiom":"iphone","scale":"2x","size":"29x29"},
              {"filename":"icon-29@3x.png","idiom":"iphone","scale":"3x","size":"29x29"},
              {"filename":"icon-40@2x.png","idiom":"iphone","scale":"2x","size":"40x40"},
              {"filename":"icon-40@3x.png","idiom":"iphone","scale":"3x","size":"40x40"},
              {"filename":"icon-60@2x.png","idiom":"iphone","scale":"2x","size":"60x60"},
              {"filename":"icon-60@3x.png","idiom":"iphone","scale":"3x","size":"60x60"},
              {"filename":"icon-1024.png","idiom":"ios-marketing","scale":"1x","size":"1024x1024"}
            ],
            "info": {"author":"xcode","version":1}
          }
          JSON

      - name: Generate Xcode project
        script: xcodegen generate

      - name: Apply Apple signing profiles
        script: xcode-project use-profiles

      - name: Build signed IPA
        script: |
          xcode-project build-ipa             --project "$CM_BUILD_DIR/$XCODE_PROJECT"             --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
