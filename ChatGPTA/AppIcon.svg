<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#073b32"/>
      <stop offset="0.48" stop-color="#041e1b"/>
      <stop offset="1" stop-color="#050708"/>
    </radialGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8dffe4"/>
      <stop offset="0.34" stop-color="#21e8bc"/>
      <stop offset="0.68" stop-color="#13b8a5"/>
      <stop offset="1" stop-color="#08766f"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect x="28" y="28" width="968" height="968" rx="202" fill="none" stroke="#1fffe0" stroke-opacity=".28" stroke-width="8"/>
  <g transform="translate(512 512)" fill="none" stroke="url(#emerald)" stroke-width="98" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)">
    <ellipse rx="165" ry="330"/>
    <ellipse rx="165" ry="330" transform="rotate(60)"/>
    <ellipse rx="165" ry="330" transform="rotate(120)"/>
  </g>
  <g transform="translate(512 512)" fill="none" stroke="#85ffe7" stroke-opacity=".42" stroke-width="12" filter="url(#glow)">
    <ellipse rx="165" ry="330"/>
    <ellipse rx="165" ry="330" transform="rotate(60)"/>
    <ellipse rx="165" ry="330" transform="rotate(120)"/>
  </g>
  <circle cx="512" cy="512" r="114" fill="#051512"/>
</svg>
